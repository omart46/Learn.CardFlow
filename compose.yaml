name: cardflow
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cardflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${CARDFLOW_SQL_PASSWORD:?Set CARDFLOW_SQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - cardflow-sql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  cardflow-sql-data:
